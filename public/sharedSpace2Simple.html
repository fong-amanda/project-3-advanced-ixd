function hydrateThumbs() { for (const el of document.querySelectorAll('img[data-thumb]')) { const f = el.dataset.thumb; if (PRODUCT_IMG[f]) { el.src = PRODUCT_IMG[f]; continue; } Thumbs.request(f, url => { if (url && el.isConnected) el.src = url; }); } }

/* ---------- render ---------- */
function render() {
  const [s, b] = BEATS[at];
  const sam = s === 'sam', share = s === 'plan' && b === 1;
  const items = itemsAt(s, b);
  const mine = s === 'home' ? sHome() : s === 'start' ? sStart() : s === 'scan' ? sScan(b) : s === 'model' ? sModel() : sam ? sRoom(items, b >= 12 ? 'Next steps' : 'Waiting for your child') : s === 'answered' ? sAnswered(items) : s === '3d' ? s3D(b) : s === 'setup' ? sSetup(b) : s === 'shop' ? sShop(b) : sPlan(b);
  document.getElementById('app').innerHTML = `
    <div class="phones">
      <div class="col ${sam || share ? 'dim still' : prevScreen !== s ? 'fade' : ''}"><div class="who"><i></i>Your phone</div><div class="phone"><div class="screen">${mine}</div></div></div>
      ${sam ? `<div class="col sam ${prevScreen === 'sam' ? '' : 'enter'}"><div class="who sam"><i></i>Your child’s phone</div><div class="phone"><div class="screen">${sSam(b)}</div></div></div>` : share ? `<div class="col sam enter"><div class="who sam"><i></i>Your child’s phone</div><div class="phone"><div class="screen">${sSamShare()}</div></div></div>` : ''}
    </div>
    <div class="controls"><button id="back" ${at === 0 ? 'disabled' : ''}><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Back</button><span class="step">${at + 1} / ${BEATS.length}</span><button class="next" id="next" ${at === BEATS.length - 1 ? 'disabled' : ''}>Next<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>`;
  document.getElementById('next').onclick = () => step(1);
  document.getElementById('back').onclick = () => step(-1);
  for (const el of document.querySelectorAll('[data-view]')) el.onclick = () => { viewOverride = el.dataset.view; render(); };
  const fin = document.querySelector('[data-finish]'); if (fin) setTimeout(() => { if (!fin.isConnected) return; fin.classList.add('done'); fin.querySelector('.spin').innerHTML = I.check; fin.querySelector('.txt').textContent = '6 things found'; }, +fin.dataset.finish);
  sync3D(s, b); hydrateThumbs(); hydrateCrops();
  prevScreen = s;
}
function step(d) { at = Math.max(0, Math.min(BEATS.length - 1, at + d)); viewOverride = null; render(); }
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
  if (e.key === 'Home' || e.key.toLowerCase() === 'r') { at = 0; render(); }
});
render();
</script>
