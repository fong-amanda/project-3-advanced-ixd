<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f7">
<title>Shared Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%;
  --desk:#dfe4e7;--bg:#f4f6f7;--surface:#ffffff;--surface2:#eef1f3;--text:#1f2a33;--muted:#5b6872;--line:#dbe1e5;--line2:#c3ccd3;
  --accent:#2f5d62;--accent-ink:#ffffff;--accent-soft:#dfeceb;--marigold:#c38a17;
  --keep:#3f7d5a;--remove:#5d6b78;--repurpose:#3b6ea5;--store:#86599a;--discuss:#c38a17;--none:#8f9aa2;
  --wall:#e6e1d8;--floor:#c9ad88;--plank:#b89a74;--board:#f3efe8;--frame:#f7f5f1;--glass:#cfe2ec;
  --wood:#a87c55;--wood2:#86603f;--woodIn:#7a5638;--sheet:#fbfaf7;--blanket:#7f9bb5;--fabric:#5f7f99;--metal:#5d646a;--shade:#f0d9a8;--plant:#5e8b5a;
  --nWood:#d2b48a;--nSheet:#ffffff;--nBlanket:#9cbca8;--nFabric:#c9b18c;--rug:#b9c7c2;--weave:#c8a874;
  --ghost:rgba(244,246,247,.78);--shadow:0 1px 2px rgba(31,42,51,.06),0 6px 18px rgba(31,42,51,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --desk:#0d1215;--bg:#141a1f;--surface:#1d252b;--surface2:#252f36;--text:#e7ecef;--muted:#9aa8b2;--line:#2f3b44;--line2:#3a4852;
  --accent:#7fb7b1;--accent-ink:#0f1b1c;--accent-soft:#22393a;--marigold:#e0b04d;
  --keep:#6fb68a;--remove:#93a3b0;--repurpose:#79a7da;--store:#b993cc;--discuss:#e0b04d;--none:#6c7a84;
  --wall:#3a3631;--floor:#55453a;--plank:#4a3c32;--board:#4a4540;--frame:#5a5550;--glass:#3a5463;
  --wood:#7d5d43;--wood2:#644a35;--woodIn:#563f2d;--sheet:#d8d6d1;--blanket:#4f6a82;--fabric:#46627a;--metal:#8a9298;--shade:#c9b27f;--plant:#4c7449;
  --nWood:#a88d68;--nSheet:#ecebe7;--nBlanket:#6f9180;--nFabric:#9e8a6b;--rug:#4f5f5a;--weave:#9d8458;
  --ghost:rgba(20,26,31,.78);--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{color-scheme:dark;
  --desk:#0d1215;--bg:#141a1f;--surface:#1d252b;--surface2:#252f36;--text:#e7ecef;--muted:#9aa8b2;--line:#2f3b44;--line2:#3a4852;
  --accent:#7fb7b1;--accent-ink:#0f1b1c;--accent-soft:#22393a;--marigold:#e0b04d;
  --keep:#6fb68a;--remove:#93a3b0;--repurpose:#79a7da;--store:#b993cc;--discuss:#e0b04d;--none:#6c7a84;
  --wall:#3a3631;--floor:#55453a;--plank:#4a3c32;--board:#4a4540;--frame:#5a5550;--glass:#3a5463;
  --wood:#7d5d43;--wood2:#644a35;--woodIn:#563f2d;--sheet:#d8d6d1;--blanket:#4f6a82;--fabric:#46627a;--metal:#8a9298;--shade:#c9b27f;--plant:#4c7449;
  --nWood:#a88d68;--nSheet:#ecebe7;--nBlanket:#6f9180;--nFabric:#9e8a6b;--rug:#4f5f5a;--weave:#9d8458;
  --ghost:rgba(20,26,31,.78);--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:center;gap:40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;font-weight:650;margin:0;letter-spacing:-.01em;line-height:1.2}
h1{font-size:1.55rem}h2{font-size:1.2rem}h3{font-size:1rem}
p{margin:.25rem 0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.tiny{font-size:.78rem;color:var(--muted)}

/* phone shell */
.phone{width:100%;height:100%;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media (min-width:640px){
  body{background:var(--desk);padding:24px}
  .phone{width:400px;height:min(860px,100%);border-radius:42px;border:9px solid #11171b;box-shadow:0 30px 80px rgba(0,0,0,.25);flex:none}
}
.side{display:none;max-width:320px}
@media (min-width:1000px){.side{display:block}}
.side h2{margin-bottom:6px}
.side ol{padding-left:0;list-style:none;margin:14px 0;display:grid;gap:8px}
.side li{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.side li .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center;font-size:.7rem;color:#fff;margin-top:1px}
.side li.done .ck{background:var(--keep);border-color:var(--keep)}
.side li.done span:last-child{color:var(--muted)}

.topbar{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;background:var(--bg);flex:none;min-height:58px}
.topbar .tt{flex:1;min-width:0}
.topbar .tt h1{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .tt div{font-size:.78rem;color:var(--muted)}
.ib{border:0;background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.ib svg{width:20px;height:20px}
.whochip{border:0;background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;display:flex;gap:6px;align-items:center;font-weight:700;font-size:.82rem;box-shadow:var(--shadow);flex:none}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 14px 24px;position:relative}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 8px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);padding:4px 0;position:relative;font-weight:700}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .bdg{position:absolute;top:0;left:calc(50% + 6px);background:var(--discuss);color:#fff;border-radius:999px;font-size:.62rem;padding:0 5px;line-height:16px}

.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:.78rem;flex:none}
.av.s{width:20px;height:20px;font-size:.62rem}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%;padding:13px}
.btn.small{padding:6px 10px;font-size:.8rem;border-radius:9px}
.btn svg{width:18px;height:18px}
.link{border:0;background:none;color:var(--accent);padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.sec{margin-top:18px}
.sec>h3{margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner{padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:.86rem;margin-top:10px}
.banner.warn{background:color-mix(in srgb,var(--discuss) 16%,var(--surface))}
.banner.final{background:color-mix(in srgb,var(--keep) 16%,var(--surface))}

/* home */
.hello{padding:8px 0 4px}
.scanhero{margin-top:14px;border:0;width:100%;text-align:left;border-radius:22px;padding:18px;background:var(--accent);color:var(--accent-ink);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.scanhero h2{font-size:1.25rem}
.scanhero p{opacity:.88;font-size:.88rem}
.vf{width:78px;height:78px;position:relative}
.vf i{position:absolute;width:22px;height:22px;border:3px solid currentColor}
.vf i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.vf i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.vf i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
.vf i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
.vf svg{position:absolute;inset:20px;width:38px;height:38px}
.proj{border:0;width:100%;text-align:left;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);padding:0;display:block;margin-bottom:12px}
.proj img{display:block;width:100%;aspect-ratio:16/8;object-fit:cover}
.proj .pb{padding:12px 14px}
.proj .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.8rem;color:var(--muted)}
.stack-av{display:flex}.stack-av .av{border:2px solid var(--surface);margin-left:-6px}.stack-av .av:first-child{margin-left:0}

/* photo stage */
.stage{position:relative;border-radius:16px;overflow:hidden;background:var(--surface2);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.stage img.ph{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.bx{position:absolute;border:2.5px solid var(--c);border-radius:10px;background:transparent;padding:0;color:inherit}
.bx.open{border-style:dashed}
.bx.sel{background:color-mix(in srgb,var(--c) 18%,transparent);border-width:3.5px}
.bx .pill{position:absolute;left:4px;top:-11px;background:var(--c);color:#fff;font-size:.66rem;font-weight:700;border-radius:999px;padding:1px 7px;white-space:nowrap;max-width:calc(100% + 40px);overflow:hidden;text-overflow:ellipsis;line-height:18px}
.s-keep{--c:var(--keep)}.s-remove{--c:var(--remove)}.s-repurpose{--c:var(--repurpose)}.s-store{--c:var(--store)}.s-discuss{--c:var(--discuss)}.s-none{--c:var(--none)}.s-scan{--c:var(--accent)}
.gh{position:absolute;border:2px dashed var(--muted);border-radius:10px;background:var(--ghost);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;text-align:center;font-size:.66rem;color:var(--muted);font-weight:700;line-height:1.2}
.gh span{font-weight:400}
.tk{position:absolute;touch-action:none}
.tk svg{display:block;width:100%;height:auto;overflow:visible}
.tk .tag{position:absolute;right:0;top:-10px;background:var(--accent);color:var(--accent-ink);font-size:.62rem;font-weight:700;border-radius:999px;padding:0 7px;line-height:17px}
.tk.prev .tag{background:var(--marigold);color:#fff}
.tk.drag{cursor:grab;outline:2px dashed var(--accent);outline-offset:2px;border-radius:8px}
.tk.dragging{cursor:grabbing;opacity:.85}
.tk .flag{position:absolute;left:0;top:-10px}
.oflag{position:absolute;background:var(--discuss);color:#fff;font-size:.62rem;font-weight:700;border-radius:999px;padding:0 7px;line-height:17px;white-space:nowrap}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--accent);box-shadow:0 0 18px 6px color-mix(in srgb,var(--accent) 55%,transparent);animation:scan 2.2s ease-in-out infinite alternate}
@keyframes scan{from{top:4%}to{top:94%}}
.scanveil{position:absolute;inset:0;background:color-mix(in srgb,var(--accent) 10%,transparent)}
@media (prefers-reduced-motion:reduce){.scanline{animation:none;top:50%}}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;gap:5px;align-items:center;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:700;color:#fff;white-space:nowrap;background:var(--c)}
.chip.outline{background:transparent;border:1.5px dashed var(--c);color:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.74rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;background:var(--c)}
.items{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.items li+li{border-top:1px solid var(--line)}
.items button.it{width:100%;border:0;background:none;text-align:left;padding:12px 14px;display:flex;align-items:center;gap:10px}
.items .nm{flex:1;min-width:0;font-weight:700}
.items .nm small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.chev{width:16px;height:16px;color:var(--muted);flex:none}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat div{background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);font-size:.82rem;color:var(--muted)}
.stat strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem;color:var(--text);line-height:1.1}

/* segmented */
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 8px;font-weight:700;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* sheet */
.sheetwrap{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.backdrop{position:absolute;inset:0;background:rgba(10,15,20,.42);border:0;padding:0;width:100%}
.sheet{position:relative;background:var(--surface);border-radius:22px 22px 0 0;max-height:90%;overflow-y:auto;padding:8px 16px 22px;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.anim{animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet.anim{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:4px auto 10px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.x{border:0;background:var(--surface2);width:32px;height:32px;border-radius:50%;font-size:1.15rem;line-height:1;flex:none}
.sub{margin:18px 0 8px;font-size:.92rem}
.meaning{margin-top:10px;border-left:3px solid var(--store);background:var(--surface2);padding:9px 12px;border-radius:0 10px 10px 0;font-size:.88rem}
.meaning b{display:block;font-size:.76rem;color:var(--store)}
.stances{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stances li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px;background:var(--surface2);border-radius:12px}
.stances .n{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stances .nt{font-size:.86rem;margin-top:2px}
.note{font-size:.85rem;background:color-mix(in srgb,var(--discuss) 14%,var(--surface));padding:9px 12px;border-radius:10px;margin-top:10px}
textarea,input[type=text],input[type=url],input[type=number],select{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:11px;padding:9px 11px;font-size:16px}
textarea{resize:vertical;min-height:54px}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.sbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 10px;text-align:left;display:flex;flex-direction:column}
.sbtn b{display:flex;align-items:center;gap:7px;font-size:.88rem}
.sbtn b::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.sbtn small{color:var(--muted);font-size:.72rem}
.sbtn.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.sbtn:last-child{grid-column:1/-1}
details summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:.9rem}
.thread{display:grid;gap:10px}
.cmt{display:grid;grid-template-columns:auto 1fr;gap:8px}
.cmt .bub{background:var(--surface2);border-radius:4px 14px 14px 14px;padding:8px 11px;font-size:.9rem}
.cmt .mt{font-size:.74rem;color:var(--muted);display:flex;gap:6px;margin-bottom:2px}
.cmt .mt b{color:var(--text)}
.composer{display:flex;gap:6px;margin-top:10px;align-items:flex-end}
.composer textarea{min-height:42px;height:42px;flex:1}
.empty{color:var(--muted);font-size:.86rem}
.hist{list-style:none;padding:0;margin:0;font-size:.82rem;display:grid;gap:6px}
.hist li{display:flex;gap:8px;align-items:baseline}
.hist time{color:var(--muted);white-space:nowrap;font-size:.72rem;margin-left:auto}
.field{display:grid;gap:4px;margin-bottom:10px;font-size:.86rem;font-weight:700}
.field span{font-weight:400;color:var(--muted);font-size:.76rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* shortlist */
.pc{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.pc.cmp{box-shadow:0 0 0 2.5px var(--accent)}
.pc .top{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px}
.thumb{background:var(--wall);border-radius:12px;display:grid;place-items:center;aspect-ratio:1;padding:6px}
.thumb svg{width:100%;height:100%}
.pc h3{font-size:.96rem}
.price{font-family:"Bricolage Grotesque",sans-serif;font-weight:650}
.by{font-size:.78rem;color:var(--muted);display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:2px}
.pc .bot{padding:0 12px 12px;display:grid;gap:8px}
.reacts{display:flex;gap:5px;flex-wrap:wrap}
.rb{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 10px;font-size:.78rem;display:inline-flex;gap:5px;align-items:center}
.rb.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.rb .who{color:var(--muted);font-weight:400}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;margin-left:auto}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.fab{position:absolute;right:16px;bottom:78px;z-index:20;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:12px 18px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.22);display:flex;gap:6px;align-items:center}
.fab svg{width:18px;height:18px}
.tray{position:absolute;left:12px;right:12px;bottom:78px;z-index:21;background:var(--text);color:var(--bg);border-radius:16px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.86rem}
.tray .btn{background:var(--bg);color:var(--text);border:0}
.scroller{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.ct{border-collapse:collapse;font-size:.84rem;min-width:100%}
table.ct th,table.ct td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top;min-width:120px}
table.ct th{color:var(--muted);font-weight:400;min-width:84px;position:sticky;left:0;background:var(--surface)}
table.ct .thumb{width:100px}

/* layouts */
.lname{margin-top:12px}
.ribbon{display:flex;gap:8px;align-items:center;font-size:.8rem;margin:10px 0 8px;color:var(--muted)}
.ribbon b{color:var(--text)}
.ribbon.final b{color:var(--keep)}
.sumgrid{display:grid;gap:8px}
.sumgrid .card{padding:12px 14px}
.sumgrid h3{display:flex;gap:8px;align-items:center;font-size:.9rem}
.sumgrid h3 i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.sumgrid ul{list-style:none;padding:0;margin:6px 0 0;font-size:.86rem;display:grid;gap:3px}
.fl{font-size:.72rem;color:var(--discuss);font-weight:700}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tg{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem}

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function rel(t){const s=(Date.now()-t)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';const d=Math.floor(s/86400);return d===1?'yesterday':d+' days ago'}
const av=(u,sm)=>`<span class="av ${sm?'s':''}" style="background:${u.color}" aria-hidden="true">${esc((u.name||'?')[0])}</span>`;

/* Silence is never agreement: an item is only agreed when everyone has said the same thing. */
function derived(o){
  const given=PR.users.map(u=>o.positions[u.id]&&o.positions[u.id].status).filter(Boolean);
  const waiting=PR.users.filter(u=>!o.positions[u.id]).map(u=>u.name);
  if(given.includes('discuss'))return{status:'discuss',kind:'discuss',waiting};
  const set=new Set(given);
  if(set.size>1)return{status:'discuss',kind:'differ',waiting};
  if(set.size===0)return{status:'none',kind:'none',waiting};
  return{status:given[0],kind:waiting.length?'pending':'agreed',waiting};
}
const resolved=o=>derived(o).kind==='agreed';
const shownStatus=d=>(d.kind==='agreed'||d.kind==='pending')?d.status:d.kind==='none'?'none':'discuss';
function shortLabel(d){return d.kind==='differ'?'Needs discussion':d.kind==='none'?'No views yet':STATUS[d.status].label}
function badge(o,big){
  const d=derived(o),s=shownStatus(d);
  if(d.kind==='agreed')return`<span class="chip s-${s}">${STATUS[s].label}</span>`;
  if(d.kind==='differ'||d.kind==='discuss')return`<span class="chip s-discuss">Needs discussion</span>`;
  if(d.kind==='none')return`<span class="chip outline s-none">No views yet</span>`;
  return`<span class="chip outline s-${s}">${STATUS[s].label}</span>${big?` <span class="tiny">Waiting to hear from ${esc(names(d.waiting))}</span>`:''}`;
}
function proposer(o){const e=Object.entries(o.positions).filter(([,p])=>p.status!=='keep').sort((a,b)=>a[1].at-b[1].at)[0];return e?U(e[0]):null}

/* proposed plan */
function plan(lay,mode){
  const out={};
  for(const o of PR.objects){
    let st,flag='';
    if(lay.overrides[o.id]){st=lay.overrides[o.id];flag='layout'}
    else{const d=derived(o);
      if(d.kind==='agreed')st=d.status;
      else if(mode==='final'){st=(PR.final&&PR.final.decisions[o.id])||'keep';flag='decided'}
      else{const op=o.positions[PR.ownerId];st=op?op.status:'keep';if(st==='discuss')st='keep';flag='open'}}
    out[o.id]={status:st,flag};
  }
  return out;
}
const REPLACES={bed:['bed','sofa'],sofa:['bed','sofa'],desk:['desk'],chair:['chair'],storage:['storage','dresser'],lamp:['lamp'],rug:['rug']};
function placements(lay,pl){
  const ids=[...lay.productIds];if(ui.preview&&!ids.includes(ui.preview))ids.push(ui.preview);
  const used=new Set(),out=[];
  for(const id of ids){const p=P(id);if(!p)continue;const b=PBOX[p.cat]||PBOX.other;const hOverW=b[3]/b[2];
    let pos=lay.placements&&lay.placements[id],target=null;
    if(!pos){const t=PR.objects.find(o=>!used.has(o.id)&&(REPLACES[p.cat]||[]).includes(o.cat)&&HIDE.has(pl[o.id].status));
      if(t){used.add(t.id);target=t.id;const w=t.box[2];const h=w*hOverW*PR.ar;pos={x:t.box[0],y:Math.max(0,t.box[1]+t.box[3]-h),w}}
      else{const q=pct(b);pos={x:q[0],y:q[1],w:q[2]}}}
    else if(pos.replaces)used.add(pos.replaces);
    out.push({p,pos,target:target||(pos&&pos.replaces)||null,isPrev:id===ui.preview&&!lay.productIds.includes(id)});
  }
  return out;
}

/* ---------- photo stage ---------- */
function stage(mode,opt){
  opt=opt||{};
  let s=`<div class="stage" id="stage" style="aspect-ratio:${PR.ar}"><img class="ph" src="${photoSrc(PR)}" alt="${mode==='original'?'Original room photo':'Room photo'}">`;
  if(mode==='edit'){
    for(const o of PR.objects){const d=derived(o),st=shownStatus(d),b=o.box;
      s+=`<button class="bx s-${st} ${d.kind!=='agreed'?'open':''} ${ui.sheet&&ui.sheet.id===o.id?'sel':''}" style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%" data-a="obj" data-id="${o.id}" aria-label="${esc(o.name)}: ${esc(shortLabel(d))}"><span class="pill">${esc(o.name)}${o.meaningful.length?' ♡':''}</span></button>`}
  }else if(mode==='proposed'||mode==='final'){
    const lay=opt.layout,pl=plan(lay,mode),pls=placements(lay,pl),replaced=new Set(pls.map(x=>x.target).filter(Boolean));
    for(const o of PR.objects){const f=pl[o.id],b=o.box;
      if(HIDE.has(f.status)){s+=`<div class="gh" style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%">${replaced.has(o.id)?'':`${esc(o.name)}<span>${STATUS[f.status].label}${f.flag==='open'?', not agreed':''}</span>`}</div>`}
      else if(f.flag==='open')s+=`<span class="oflag" style="left:${b[0]}%;top:calc(${b[1]}% - 8px)">Not agreed yet</span>`;
    }
    const order=pls.slice().sort((a,b)=>(a.p.cat==='rug'?-1:0)-(b.p.cat==='rug'?-1:0)||a.pos.y-b.pos.y);
    for(const x of order){const dr=ui.arrange&&can('editLayouts')&&!PR.final&&mode==='proposed';
      s+=`<div class="tk ${x.isPrev?'prev':''} ${dr?'drag':''}" data-pid="${x.p.id}" style="left:${x.pos.x}%;top:${x.pos.y}%;width:${x.pos.w}%">${art(x.p.cat)}<span class="tag">${x.isPrev?'Preview':'New'}</span></div>`}
  }
  if(opt.scan){
    if(opt.scan.step==='analyzing')s+=`<div class="scanveil"></div><div class="scanline"></div>`;
    (opt.scan.objects||[]).forEach((o,i)=>{const b=o.box;s+=`<div class="bx s-scan" style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%;pointer-events:none"><span class="pill">${i+1}. ${esc(o.name)}</span></div>`});
  }
  return s+'</div>';
}

function downscale(src,max){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let w=img.naturalWidth||1200,h=img.naturalHeight||750;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);const dataUrl=c.toDataURL('image/jpeg',.74);c.toBlob(b=>res({blob:b,dataUrl,w,h}),'image/jpeg',.82)};img.onerror=()=>rej(new Error('img'));img.src=src})}
const SCAN_PROMPT=`You are the room scanner in an interior-design app. Look at this photo of a room and find the distinct furniture items and personal belongings someone might decide to keep, move or remove (for example: bed, desk, bookshelf, dresser, nightstand, chair, sofa, lamp, rug, mirror, wall photos or posters, plants, boxes).
Return at most 12 items, biggest and most important first. Merge small clutter into one item such as "Photos and decorations". Skip walls, windows, doors, floors and ceilings.
For each item give:
- name: short, sentence case, e.g. "Desk", "Bedside table"
- cat: one of bed, desk, shelf, dresser, table, chair, sofa, lamp, rug, decor, storage, other
- x, y, w, h: a tight bounding box as percentages (0-100) of the image width and height, where x,y is the top-left corner
Also give roomType: a short guess such as "bedroom" or "office".
Respond with only JSON in this exact shape: {"roomType":"bedroom","objects":[{"name":"Desk","cat":"desk","x":10,"y":40,"w":20,"h":25}]}`;
function normalize(data){
  const list=(data&&Array.isArray(data.objects))?data.objects:[];
  return list.slice(0,12).map(o=>{let x=+o.x,y=+o.y,w=+o.w,h=+o.h;if([x,y,w,h].some(v=>!isFinite(v)))return null;
    if(Math.max(x,y,w,h)<=1.0001){x*=100;y*=100;w*=100;h*=100}
    x=Math.max(0,Math.min(97,x));y=Math.max(0,Math.min(97,y));w=Math.max(3,Math.min(100-x,w));h=Math.max(3,Math.min(100-y,h));
    const cat=OCATS[o.cat]?o.cat:'other';const name=String(o.name||OCATS[cat]).slice(0,40);return{name:name.charAt(0).toUpperCase()+name.slice(1),cat,box:[+x.toFixed(1),+y.toFixed(1),+w.toFixed(1),+h.toFixed(1)]}}).filter(Boolean);
}
const SCAN_ERR={not_granted:'Claude wasn’t given permission to look at the photo, so tag items yourself: tap each one on the photo.',rate_limited:'Too many scans in a row. Tag items yourself for now: tap each one on the photo.',image_rejected:'That photo couldn’t be read. Try another, or tap each item on the photo to tag it.',refused:'The photo couldn’t be scanned. Tap each item on the photo to tag it.'};
async function runScan(src){
  let img;try{img=await downscale(src,1280)}catch(e){toast('That photo couldn’t be opened. Try another one.');return}
  ui.scan={step:'analyzing',photo:img.dataUrl,ar:img.w/img.h,objects:[],note:'',title:'',purpose:'Guest room',owner:''};render();
  const fallback=note=>{if(!ui.scan)return;ui.scan.step='review';ui.scan.note=note;render()};
  const sample=await sampler();
  if(!sample)return fallback('Automatic detection isn’t available here, so tag items yourself: tap each one on the photo.');
  try{const lim=await sample.limits();if(!lim||!lim.images)return fallback('Automatic detection isn’t available here, so tag items yourself: tap each one on the photo.')}catch(e){return fallback('Automatic detection isn’t available here, so tag items yourself: tap each one on the photo.')}
  scanCtl=new AbortController();
  try{
    const data=await sample.json(SCAN_PROMPT,{images:[img.blob],signal:scanCtl.signal});
    if(!ui.scan||ui.scan.step!=='analyzing')return;
    ui.scan.objects=normalize(data);ui.scan.roomType=String((data&&data.roomType)||'room').slice(0,30);ui.scan.step='review';
    ui.scan.note=ui.scan.objects.length?'':'Nothing was found in this photo. Tap each item to tag it.';done('scan');render();
  }catch(e){if(e&&e.code==='cancelled')return;fallback(SCAN_ERR[e&&e.code]||'The scan didn’t finish. Tap each item on the photo to tag it.')}
}
function readFile(f){if(!f)return;const r=new FileReader();r.onload=()=>runScan(r.result);r.readAsDataURL(f)}

const TOUCH=matchMedia('(pointer:coarse)').matches;
const cam={stream:null,ready:false};
async function openCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw{name:'NotSupported'};
  if(cam.stream)return;
  cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
  const v=document.getElementById('camv');v.srcObject=cam.stream;v.style.display='block';try{await v.play()}catch(e){}
}
function closeCamera(){if(cam.stream){cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null}cam.ready=false;const v=document.getElementById('camv');if(v){v.srcObject=null;v.style.display='none'}}
function camErr(e){const n=e&&e.name;
  if(n==='NotAllowedError'||n==='SecurityError')return'The camera is blocked here. If you declined, allow camera access in your browser settings. Some apps don’t let embedded pages use the camera, so you can upload a photo instead.';
  if(n==='NotFoundError'||n==='OverconstrainedError')return'No camera was found on this device. Upload a photo instead.';
  if(n==='NotReadableError')return'The camera is in use by another app. Close it and try again.';
  return'The camera can’t be opened in this browser. Upload a photo instead.'}

function centroid(m){const v=[...m.values()];return{x:v.reduce((a,b)=>a+b.x,0)/v.length,y:v.reduce((a,b)=>a+b.y,0)/v.length}}

const arUp=e=>{if(!arPtr.has(e.pointerId))return;arPtr.delete(e.pointerId);if(arPtr.size===0){arG=null;save()}else arBase()};
document.addEventListener('pointerup',arUp);document.addEventListener('pointercancel',arUp);
document.addEventListener('wheel',e=>{if(ui.screen!=='ar'||!ui.ar||ui.ar.sel==null||!e.target.closest('#arlayer'))return;e.preventDefault();const it=ui.ar.items[ui.ar.sel];it.w=Math.max(5,Math.min(140,it.w*(1-e.deltaY*.0012)));const el=document.querySelector(`.art[data-ari="${ui.ar.sel}"]`);if(el)el.style.width=it.w+'%'},{passive:false});
const PRODUCT_CSS='.nWood{fill:#d2b48a}.nSheet{fill:#fff;stroke:rgba(0,0,0,.12)}.nBlanket{fill:#9cbca8}.nFabric{fill:#c9b18c}.rug{fill:#b9c7c2}.weave{fill:#c8a874}.metal{fill:#5d646a}.shade{fill:#f0d9a8}';
function svgImg(cat){const b=PBOX[cat]||PBOX.other;const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${b.join(' ')}" width="${b[2]*2}" height="${b[3]*2}"><style>${PRODUCT_CSS}</style>${PDRAW[cat]||PDRAW.other}</svg>`;
  return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)})}
async function composeAR(){
  const v=document.getElementById('camv'),layer=document.getElementById('arlayer');if(!v.videoWidth||!layer)throw new Error('no video');
  const lr=layer.getBoundingClientRect(),W=lr.width,H=lr.height,k=1000/Math.max(W,H);
  const c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);const x=c.getContext('2d');
  const vw=v.videoWidth,vh=v.videoHeight,sc=Math.max(W/vw,H/vh),sw=W/sc,sh=H/sc;x.drawImage(v,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,c.width,c.height);
  x.shadowColor='rgba(0,0,0,.4)';x.shadowBlur=14*k;x.shadowOffsetY=8*k;
  for(let i=0;i<ui.ar.items.length;i++){const p=P(ui.ar.items[i].pid);const el=layer.querySelector(`.art[data-ari="${i}"] svg`);if(!p||!el)continue;const r=el.getBoundingClientRect();const img=await svgImg(p.cat);x.drawImage(img,(r.left-lr.left)*k,(r.top-lr.top)*k,r.width*k,r.height*k)}
  return c.toDataURL('image/jpeg',.72);
}

/* ---------- WebXR floor AR (life-size 3D pieces) ---------- */
let XR=null;
async function detectXR(){try{ui.xr=!!(navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar'))}catch(e){ui.xr=false}if(ui.xr)render()}
function loadThree(){return window.THREE?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function model(cat){const T=THREE,g=new T.Group(),mat=c=>new T.MeshStandardMaterial({color:c,roughness:.85});
  const box=(w,h,d,c,x,y,z)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);g.add(m)};
  if(cat==='bed'){box(1.6,.3,2.05,0xd2b48a,0,.15,0);box(1.54,.22,1.95,0xffffff,0,.41,.03);box(1.58,.06,1.3,0x9cbca8,0,.55,.35);box(1.6,1,.08,0xd2b48a,0,.5,-1.02);box(.6,.12,.34,0xffffff,-.4,.58,-.76);box(.6,.12,.34,0xffffff,.4,.58,-.76)}
  else if(cat==='sofa'){box(2,.42,.9,0xc9b18c,0,.21,0);box(2,.45,.2,0xc9b18c,0,.62,-.35);box(.2,.26,.9,0xbfa67f,-.9,.55,0);box(.2,.26,.9,0xbfa67f,.9,.55,0)}
  else if(cat==='chair'){box(.8,.42,.8,0xc9b18c,0,.21,0);box(.8,.5,.15,0xc9b18c,0,.67,-.32);box(.12,.22,.8,0xbfa67f,-.34,.53,0);box(.12,.22,.8,0xbfa67f,.34,.53,0)}
  else if(cat==='storage'){box(1.1,.45,.4,0xd2b48a,0,.225,0);[-.36,0,.36].forEach(x=>box(.32,.3,.02,0xc8a874,x,.22,.205))}
  else if(cat==='lamp'){const p=new T.Mesh(new T.CylinderGeometry(.015,.015,1.55,12),mat(0x5d646a));p.position.y=.78;g.add(p);const b=new T.Mesh(new T.CylinderGeometry(.16,.16,.03,24),mat(0x5d646a));b.position.y=.015;g.add(b);const s=new T.Mesh(new T.CylinderGeometry(.14,.22,.28,24,1,true),new T.MeshStandardMaterial({color:0xf0d9a8,side:T.DoubleSide,emissive:0x664400,emissiveIntensity:.35}));s.position.y=1.6;g.add(s)}
  else if(cat==='rug'){const r=new T.Mesh(new T.CylinderGeometry(1,1,.01,48),mat(0xb9c7c2));r.scale.set(1,1,.7);r.position.y=.005;g.add(r)}
  else if(cat==='desk'){box(1.2,.04,.6,0xd2b48a,0,.73,0);[[-.56,-.26],[.56,-.26],[-.56,.26],[.56,.26]].forEach(([x,z])=>box(.04,.71,.04,0xb89a74,x,.355,z))}
  else box(.5,.5,.5,0xd2b48a,0,.25,0);
  return g}
function renderXRO(){const ov=document.getElementById('xro');if(!XR)return;const p=P(XR.pids[XR.cur]);
  ov.innerHTML=`<div class="bar xtop"><button data-x="end">Exit AR</button><span class="msg">${XR.found?`Tap to place ${esc(p?p.name:'')}`:'Move your phone slowly and point at the floor'}</span></div>
  <div class="bar xbot"><div class="xch">${XR.pids.map((id,i)=>`<button data-x="pick" data-i="${i}" aria-pressed="${i===XR.cur}">${esc(P(id).name)}</button>`).join('')}</div><div class="xrow"><button data-x="rot" ${XR.placed.length?'':'disabled'}>Rotate</button><button data-x="undo" ${XR.placed.length?'':'disabled'}>Undo</button></div></div>`}
(function(){const ov=document.getElementById('xro');
  ov.addEventListener('beforexrselect',e=>{if(e.target.closest('button'))e.preventDefault()});
  ov.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b||!XR)return;const a=b.dataset.x;
    if(a==='end')XR.session.end();else if(a==='pick'){XR.cur=+b.dataset.i}else if(a==='undo'){const m=XR.placed.pop();if(m)XR.scene.remove(m)}else if(a==='rot'){const m=XR.placed[XR.placed.length-1];if(m)m.rotation.y+=Math.PI/4}
    renderXRO()})})();
async function startXR(pids){
  const ov=document.getElementById('xro');
  try{await loadThree()}catch(e){toast('The 3D viewer couldn’t load. Use the camera view instead.');return}
  const T=THREE;
  let session;
  try{session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:ov}})}
  catch(e){toast('Floor AR couldn’t start here. Use the camera view instead.');return}
  closeCamera();
  const renderer=new T.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(window.devicePixelRatio);renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;
  const scene=new T.Scene(),camera=new T.PerspectiveCamera(70,innerWidth/innerHeight,.01,40);
  scene.add(new T.HemisphereLight(0xffffff,0x887766,1.1));const dl=new T.DirectionalLight(0xffffff,.6);dl.position.set(1,3,2);scene.add(dl);
  const ret=new T.Mesh(new T.RingGeometry(.12,.16,40).rotateX(-Math.PI/2),new T.MeshBasicMaterial({color:0xffffff}));ret.matrixAutoUpdate=false;ret.visible=false;scene.add(ret);
  XR={session,scene,placed:[],cur:0,pids,found:false};ov.style.display='flex';renderXRO();
  renderer.xr.setReferenceSpaceType('local');await renderer.xr.setSession(session);
  const hs=await session.requestHitTestSource({space:await session.requestReferenceSpace('viewer')});
  session.addEventListener('select',()=>{if(!XR||!ret.visible)return;const p=P(XR.pids[XR.cur]);if(!p)return;const m=model(p.cat);const pos=new T.Vector3(),q=new T.Quaternion(),sc=new T.Vector3();ret.matrix.decompose(pos,q,sc);m.position.copy(pos);
    try{const cp=new T.Vector3();renderer.xr.getCamera(camera).getWorldPosition(cp);m.rotation.y=Math.atan2(cp.x-pos.x,cp.z-pos.z)}catch(_){}
    scene.add(m);XR.placed.push(m);renderXRO()});
  session.addEventListener('end',()=>{renderer.setAnimationLoop(null);try{hs.cancel()}catch(_){}renderer.dispose();ov.style.display='none';ov.innerHTML='';const n=XR?XR.placed.length:0;XR=null;if(n)toast('Placed '+n+' piece'+(n>1?'s':'')+' in AR');if(ui.screen==='ar'){openCamera().then(()=>{cam.ready=true;render()}).catch(()=>{})}});
  renderer.setAnimationLoop((t,frame)=>{if(!frame)return;const hits=frame.getHitTestResults(hs);if(hits.length){const pose=hits[0].getPose(renderer.xr.getReferenceSpace());ret.visible=true;ret.matrix.fromArray(pose.transform.matrix)}else ret.visible=false;
    if(XR&&XR.found!==ret.visible){XR.found=ret.visible;renderXRO()}renderer.render(scene,camera)});
}

function readHash(){const h=(location.hash||'').slice(1);if(!h)return;for(const pr of S.projects){const u=pr.users.find(x=>x.invite===h);if(u){ui.pid=pr.id;ui.screen='project';ui.tab='room';ui.me[pr.id]=u.id;ui.welcome=true;ui.sheet=null;done('open');return}}}
window.addEventListener('hashchange',()=>{readHash();render()});
load();readHash();render();sampler();detectXR();
</script>
