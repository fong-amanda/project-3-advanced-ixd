<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shared Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  /* Warm, calm, homey palette for an older audience. Strong colour only on buttons, icons and status.
     Gum = primary, Waratah = removals and warnings only, tiles = icon circles. Status is always icon + words. */
  --bg:#F7F2EF; --surface:#FFFFFF; --surface-2:#F3ECE8; --line:#E6DDD8; --line-2:#8F8580;
  --ink:#222222; --ink-2:#222222; --muted:#555555;
  --accent:#26332E; --accent-ink:#26332E; --accent-soft:#FFFFFF; --on-accent:#FFFFFF;
  --accent-2:#821C28; --accent-2-ink:#821C28; --on-accent-2:#FFFFFF;
  --keep:#26332E; --keep-soft:#FFFFFF;
  --send:#3E5A70; --send-soft:#FFFFFF;
  --letgo:#821C28; --letgo-soft:#FFFFFF;
  --none:#555555;
  --stage:#F3ECE8;
  --tile-1:#87A6BD; --tile-2:#F0ABA6; --tile-3:#F6D5D2; --on-tile:#26332E; --gum:#26332E; --waratah:#821C28;
  --track:#F6D5D2; --fill:#26332E;
  --r-s:12px; --r-m:18px; --r-l:26px;
  --sh-1:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);
  --sh-2:0 18px 50px rgba(0,0,0,.18);
  --card-border:0;
  --f-display:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1A1A; --surface:#272423; --surface-2:#322D2C; --line:#4A4342; --line-2:#9A908C;
    --ink:#F5F2F0; --ink-2:#F5F2F0; --muted:#D3CBC7;
    --accent:#A9C2D4; --accent-ink:#A9C2D4; --accent-soft:#272423; --on-accent:#14202A;
    --accent-2:#F0ABA6; --accent-2-ink:#F0ABA6; --on-accent-2:#14202A;
    --keep:#B7CEC2; --keep-soft:#272423; --send:#A9C2D4; --send-soft:#272423;
    --letgo:#F0ABA6; --letgo-soft:#272423; --none:#D3CBC7; --stage:#272423;
    --sh-1:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1A1A; --surface:#272423; --surface-2:#322D2C; --line:#4A4342; --line-2:#9A908C;
  --ink:#F5F2F0; --ink-2:#F5F2F0; --muted:#D3CBC7;
  --accent:#A9C2D4; --accent-ink:#A9C2D4; --accent-soft:#272423; --on-accent:#14202A;
  --accent-2:#F0ABA6; --accent-2-ink:#F0ABA6; --on-accent-2:#14202A;
  --keep:#B7CEC2; --keep-soft:#272423; --send:#A9C2D4; --send-soft:#272423;
  --letgo:#F0ABA6; --letgo-soft:#272423; --none:#D3CBC7; --stage:#272423;
  --sh-1:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
html{font-size:106.25%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
/* Dynamic Type: on iPhone/iPad Safari the root size follows Settings → Display & Brightness → Text Size */
@supports (font:-apple-system-body) and (-webkit-touch-callout:none){html{font:-apple-system-body}}
button,input,textarea,select{font:inherit;color:inherit}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;letter-spacing:-.005em;line-height:1.15}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:0.9412rem}
.tiny{font-size:0.9412rem}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.lg{width:26px;height:26px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:1.5px solid transparent;font-weight:600;font-size:1rem;cursor:pointer;background:var(--ink);color:var(--bg);transition:transform .12s ease,background .15s,opacity .15s;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);padding:0 12px}
.btn.danger{background:transparent;color:var(--letgo);border-color:var(--letgo-soft)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:0.9412rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.iconbtn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.iconbtn.plain{border-color:transparent;background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:0.9412rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sm{min-height:34px;padding:0 12px;font-size:0.9412rem}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}

/* fields */
.field{display:grid;gap:6px}
.field label,.lbl{font-weight:600;font-size:0.9412rem}
.input,textarea.input,select.input{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:12px 14px;font-size:1rem}
textarea.input{min-height:84px;resize:vertical}
.input:focus{border-color:var(--ink);outline:none}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.stepper button{width:48px;height:50px;border:0;background:transparent;font-size:1.375rem;cursor:pointer}
.stepper input{flex:1;min-width:0;border:0;background:transparent;text-align:center;font-size:1.125rem;font-weight:600;height:50px}
.stepper input:focus{outline:none}
.stepper span{padding-right:12px;color:var(--muted)}

/* app chrome */
#app{min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.312rem}
.mark{width:30px;height:30px;flex:none}
.spacer{flex:1}
.avatars{display:flex;align-items:center}
.av{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:0.9412rem;border:2.5px solid var(--bg);margin-left:-8px;position:relative}
.av:first-child{margin-left:0}
.av.host{background:#2E5A49;color:#fff}
.av.guest{background:#E7A33A;color:#2B1D00}
.av.off{opacity:.45}
.av .dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:99px;background:#43B06C;border:2px solid var(--bg)}

/* home */
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(34px,6vw,56px);max-width:15ch}
.hero p{font-size:1.125rem;color:var(--ink-2);max-width:46ch;margin-top:14px}
.home-actions{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 36px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-bottom:48px}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.proj:hover{transform:translateY(-2px);box-shadow:var(--sh-1)}
.proj .ph{aspect-ratio:3/2;background:var(--stage);overflow:hidden}
.proj .ph img{width:100%;height:100%;object-fit:cover}
.proj .bd{padding:16px 18px 18px;display:grid;gap:4px}
.proj h3{font-size:1.375rem}
.transform{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:0.9412rem}
.stage-pill{display:inline-flex;align-items:center;gap:6px;font-size:0.9412rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);width:max-content;margin-top:6px}
.empty-home{border:2px dashed var(--line-2);border-radius:var(--r-l);padding:36px;text-align:center;color:var(--ink-2)}

/* create flow */
.flow{max-width:640px;margin:0 auto;padding:8px 20px 120px}
.flow-steps{display:flex;gap:6px;margin:6px 0 26px}
.flow-steps i{height:5px;border-radius:9px;background:var(--line);flex:1}
.flow-steps i.on{background:var(--ink)}
.flow h1{font-size:clamp(30px,5vw,40px);margin-bottom:8px}
.flow .lead{color:var(--ink-2);font-size:1.062rem;margin-bottom:26px}
.stack{display:grid;gap:22px}
.flow-foot{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:40}
.flow-foot .in{max-width:640px;width:100%;display:flex;gap:10px}
.flow-foot .in .btn{flex:1}
.dims{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.floorprev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px;display:grid;place-items:center}
.photo-choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo-choice{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:20px 16px;display:grid;gap:10px;justify-items:start;cursor:pointer;text-align:left;font-weight:600;position:relative}
.photo-choice span{font-weight:400;color:var(--muted);font-size:0.9412rem}
.photo-choice.wide{grid-column:1/-1;grid-template-columns:120px 1fr;align-items:center}
.photo-choice.wide img{border-radius:10px}
.photo-choice input{position:absolute;inset:0;opacity:0;cursor:pointer}
.preview-photo{border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line)}

/* project layout */
.proj-top{display:flex;align-items:center;gap:12px;padding:12px 20px;max-width:1440px;margin:0 auto}
.proj-title{min-width:0}
.proj-title h1{font-size:1.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-title .transform{font-size:0.9412rem}
.rail{display:flex;gap:6px;padding:0 20px 12px;max-width:1440px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:8px 14px 8px 8px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600;font-size:0.9412rem}
.rail button .n{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;border:1.5px solid var(--line-2);font-size:0.9412rem}
.rail button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.rail button.on .n{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rail button.done .n{background:var(--keep);border-color:var(--keep);color:#fff}
/* bottom tab bar inside a room */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:0.9412rem;font-weight:600;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.tabbar button.on{color:var(--ink)}
.tabbar button.on svg.i{stroke-width:2.3}
.tabbar-pad{height:84px}
.tabbar .tb-ic{position:relative;display:grid}
.tabbar .badge{position:absolute;top:-4px;left:16px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--letgo);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.home-title{display:flex;align-items:center;gap:12px;padding:22px 0 18px}
.home-title .mark{width:40px;height:40px}
.home-title h1{font-size:2.125rem}
.cur-tag{display:inline-flex;align-items:center;gap:4px;font-size:0.9412rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--keep-soft);color:var(--keep);margin:6px 0 0 6px}
.cur-tag svg.i{width:14px;height:14px}
body.phone .tabbar{padding-bottom:26px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px;padding:0 20px 20px;max-width:1440px;margin:0 auto;height:calc(100vh - 160px -env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:560px}
.workspace>*{min-width:0}
.stagebox{position:relative;border-radius:var(--r-l);background:var(--stage);overflow:hidden;min-height:0}
.stage3d{position:absolute;inset:0}
.stage3d canvas{display:block;width:100%!important;height:100%!important;touch-action:none;cursor:grab}
.stage3d canvas:active{cursor:grabbing}
.panel{background:var(--surface);border-radius:var(--r-l);border:1px solid var(--line);overflow:auto;min-height:0;display:flex;flex-direction:column}
.panel-sec{padding:18px 20px;border-bottom:1px solid var(--line)}
.panel-sec:last-child{border-bottom:0}
.panel-foot{position:sticky;bottom:0;background:var(--surface);padding:14px 20px;border-top:1px solid var(--line);margin-top:auto}
.stage-tools{position:absolute;left:14px;top:14px;display:flex;gap:8px;z-index:2;flex-wrap:wrap}
.stage-tools.r{left:auto;right:14px}
.seg-toggle{display:inline-flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--sh-1)}
.seg-toggle button{border:0;background:transparent;border-radius:999px;min-height:36px;padding:0 14px;font-weight:600;font-size:0.9412rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.seg-toggle button.on{background:var(--ink);color:var(--bg)}
.stage-note{position:absolute;left:14px;bottom:14px;right:14px;display:flex;justify-content:center;pointer-events:none;z-index:2}
.stage-note>div{pointer-events:auto;background:var(--surface);border-radius:18px;box-shadow:var(--sh-1);padding:10px 14px;font-size:0.9412rem;display:flex;align-items:center;gap:10px;max-width:100%}
.fallback3d{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--muted)}
.fallback3d{display:flex;flex-direction:column}.fallback3d .plan-svg{max-height:75%;width:auto;max-width:90%;flex:0 1 auto}

/* photo + pins */
.photo{position:relative;width:100%;user-select:none;-webkit-user-select:none}
.photo>img,.photo>.photo-img{width:100%;height:auto;display:block}
.photo-fit{position:absolute;inset:0;display:grid;place-items:center;padding:14px;overflow:auto}
.photo-fit .photo{max-width:100%;border-radius:16px;overflow:hidden;box-shadow:var(--sh-1)}
.pin{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;cursor:pointer;z-index:1;touch-action:none}
.pin .pd{width:30px;height:30px;border-radius:99px;background:var(--surface);color:var(--ink);font-weight:700;font-size:0.9412rem;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.25);border:2.5px solid var(--ink);transition:transform .15s}
.pin .pl{position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);background:rgba(29,42,37,.86);color:#fff;font-size:0.9412rem;font-weight:600;padding:3px 8px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
.pin:hover .pl,.pin.sel .pl{opacity:1}
.pin.sel .pd{transform:scale(1.2);background:var(--accent);border-color:var(--accent-ink)}
.pin.st-keep .pd{border-color:var(--keep)}
.pin.st-send .pd{border-color:var(--send)}
.pin.st-letgo .pd{border-color:var(--letgo);opacity:.7}
.pin.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.pin.drag .pd{transform:scale(1.3)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(0);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.scanline{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.scanline::before{content:"";position:absolute;left:0;right:0;height:38%;top:-38%;background:rgba(135,166,189,.35);animation:scan 1.8s ease-in-out infinite}
@keyframes scan{to{top:100%}}
.scan-status{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:0.9412rem;box-shadow:var(--sh-1);display:flex;gap:8px;align-items:center;white-space:nowrap}
.spin{width:16px;height:16px;border-radius:99px;border:2.5px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* item rows */
.list{display:grid;gap:10px}
.row{border:1.5px solid var(--line);border-radius:var(--r-m);padding:10px;display:grid;gap:10px;background:var(--surface);transition:border-color .15s,box-shadow .15s;cursor:pointer}
.row.sel{border-color:var(--ink);box-shadow:var(--sh-1)}
.row-head{display:flex;align-items:center;gap:12px}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--surface-2);flex:none}
.thumb.lg{width:100%;height:auto;aspect-ratio:4/3;max-height:40vh;border-radius:20px}
.row-main{min-width:0;flex:1}
.row-title{font-weight:600;font-size:1.031rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:0.9412rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.host{background:#DCE8E2;color:#234536}
.tag.guest{background:#FBE8C6;color:#5A3D00}
.tag.both{background:var(--surface-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.host{background:#22382F;color:#BFE0CF}:root:not([data-theme="light"]) .tag.guest{background:#3A2F17;color:#F7D9A0}}
:root[data-theme="dark"] .tag.host{background:#22382F;color:#BFE0CF}
:root[data-theme="dark"] .tag.guest{background:#3A2F17;color:#F7D9A0}
.tag.keep{background:var(--keep-soft);color:var(--keep)}
.tag.send{background:var(--send-soft);color:var(--send)}
.tag.letgo{background:var(--letgo-soft);color:var(--letgo)}
.tag.sugg{background:var(--accent-soft);color:var(--accent-ink)}
.num{width:26px;height:26px;border-radius:99px;border:2px solid var(--ink);display:grid;place-items:center;font-size:0.9412rem;font-weight:700;flex:none}
.decide{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dbtn{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:0.9412rem;padding:0 6px;transition:background .15s,border-color .15s,color .15s}
.dbtn svg.i{width:18px;height:18px}
.dbtn.keep.on{background:var(--keep);border-color:var(--keep);color:#fff}
.dbtn.send.on{background:var(--send);border-color:var(--send);color:#fff}
.dbtn.letgo.on{background:var(--letgo);border-color:var(--letgo);color:#fff}
.dbtn.keep:hover{border-color:var(--keep)}
.dbtn.send:hover{border-color:var(--send)}
.dbtn.letgo:hover{border-color:var(--letgo)}
.dbtn.suggest{border-style:dashed}
.dbtn.suggest.on{background:var(--accent-soft);border-color:var(--accent);border-style:solid;color:var(--accent-ink)}
.owner-pick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row-detail{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:12px;cursor:default}
.hint{font-size:0.9412rem;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;border-radius:999px;min-height:36px;padding:0 13px;font-weight:600;font-size:0.9412rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--surface-2);color:var(--ink)}
.tabs button b{font-weight:600;opacity:.6;margin-left:4px}

/* progress */
.progress-num{font-family:var(--f-display);font-size:1.875rem;line-height:1.1}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin:12px 0 10px}
.bar i{display:block;height:100%;transition:width .4s}
.bar .keep{background:var(--keep)}.bar .send{background:var(--send)}.bar .letgo{background:var(--letgo)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:0.9412rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.freed{display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--accent-ink);border-radius:14px;padding:10px 12px;font-weight:600;margin-top:12px;font-size:0.9412rem}
.person-card{display:flex;gap:12px;align-items:center}
.code{font-family:var(--f-display);font-size:1.75rem;letter-spacing:.12em}
.invite{background:var(--surface-2);border-radius:var(--r-m);padding:16px;display:grid;gap:12px}

/* guest */
.g-wrap{max-width:560px;margin:0 auto;padding:4px 20px 40px}
.g-card{background:var(--surface);border-radius:28px;border:1px solid var(--line);padding:16px;display:grid;gap:16px;box-shadow:var(--sh-1);animation:cardIn .35s ease both}
.g-card.out-keep{animation:outL .32s ease forwards}
.g-card.out-send{animation:outU .32s ease forwards}
.g-card.out-letgo{animation:outR .32s ease forwards}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes outL{to{opacity:0;transform:translateX(-60px) rotate(-4deg)}}
@keyframes outU{to{opacity:0;transform:translateY(-60px)}}
@keyframes outR{to{opacity:0;transform:translateX(60px) rotate(4deg)}}
.g-choices{display:grid;gap:10px}
.g-choice{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 16px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.g-choice .ic{width:42px;height:42px;border-radius:99px;display:grid;place-items:center;flex:none}
.g-choice b{display:block;font-size:1.062rem}
.g-choice span{color:var(--muted);font-size:0.9412rem}
.g-choice.keep .ic{background:var(--keep-soft);color:var(--keep)}
.g-choice.send .ic{background:var(--send-soft);color:var(--send)}
.g-choice.letgo .ic{background:var(--letgo-soft);color:var(--letgo)}
.g-choice.keep:hover{border-color:var(--keep)}.g-choice.send:hover{border-color:var(--send)}.g-choice.letgo:hover{border-color:var(--letgo)}
.g-progress{display:flex;gap:4px;margin:4px 0 14px}
.g-progress i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.g-progress i.on{background:var(--ink)}
.g-hero{padding:20px 0}
.g-hero h1{font-size:clamp(28px,6vw,38px)}

/* catalogue */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod{border:1.5px solid var(--line);border-radius:var(--r-m);padding:8px;display:grid;gap:6px;background:var(--surface);cursor:pointer;text-align:left;position:relative}
.prod:hover{border-color:var(--line-2)}
.prod .pimg{aspect-ratio:4/3;border-radius:10px;background:var(--surface-2);width:100%;object-fit:contain}
.prod b{font-weight:600;font-size:0.9412rem;line-height:1.25}
.prod .meta{font-size:0.9412rem;color:var(--muted)}
.prod .price{font-weight:700;font-size:0.9412rem}
.fit{position:absolute;top:12px;left:12px;font-size:0.9412rem;font-weight:700;padding:3px 8px;border-radius:999px}
.fit.ok{background:var(--keep-soft);color:var(--keep)}
.fit.tight{background:var(--accent-soft);color:var(--accent-ink)}
.fit.no{background:var(--letgo-soft);color:var(--letgo)}
.zone-chip{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.zone-chip.on{border-color:var(--accent);background:var(--accent-soft)}
.zone-chip .zi{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);border:2px dashed var(--accent);flex:none}
.layout-tabs{display:flex;gap:6px;flex-wrap:wrap}
.layout-tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:40px;padding:0 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.layout-tabs button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px}
.stat b{display:block;font-size:1.125rem}
.stat span{font-size:0.9412rem;color:var(--muted)}
.piece-bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--surface);border-radius:20px;box-shadow:var(--sh-2);padding:10px;display:flex;align-items:center;gap:10px;z-index:3;max-width:calc(100% - 28px)}
.piece-bar .pb-info{padding:0 6px;min-width:0}
.piece-bar .pb-info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.status-ok{color:var(--keep);font-weight:600;font-size:0.9412rem}
.status-bad{color:var(--letgo);font-weight:600;font-size:0.9412rem}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(15,22,19,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}

/* ===== Older-audience theme =====
   ONE button style for the whole app: outlined (accent border + text, clear background) by default,
   filled with the accent and white text while pressed or when selected. No hover states (touch first).
   Each kind of button only sets --c (its colour); everything else is shared. Tap targets are at least 44×44. */
.btn,.chip,.iconbtn,.circ,.dbtn,.g-choice,.tabs button,.layout-tabs button,.zone-chip,.note-bar button{
  --c:var(--accent);
  background:transparent!important;color:var(--c)!important;border:2px solid var(--c)!important;
  min-height:44px!important;min-width:44px;-webkit-tap-highlight-color:transparent;transition:background .1s,color .1s;
}
.btn:active,.btn.on,.btn.accent,.btn[aria-pressed="true"],
.chip:active,.chip.on,.iconbtn:active,.circ:active,.dbtn:active,.dbtn.on,.g-choice:active,
.tabs button:active,.tabs button.on,.layout-tabs button:active,.layout-tabs button.on,
.zone-chip:active,.zone-chip.on,.note-bar button:active{
  background:var(--c)!important;color:var(--on-accent)!important;border-color:var(--c)!important;
}
.g-choice:active *,.zone-chip.on *,.zone-chip:active *{color:var(--on-accent)!important}
.btn[disabled]{opacity:.5}
.btn.danger,.dbtn.letgo,.g-choice.letgo{--c:var(--letgo)}
.dbtn.keep,.g-choice.keep{--c:var(--keep)}
.dbtn.send,.g-choice.send{--c:var(--send)}
.dbtn.suggest{border-style:dashed!important}
.dbtn.suggest.on{--c:var(--accent-2-ink);border-style:solid!important}
.iconbtn.plain{border-color:transparent!important}
.btn.ghost{padding:0 14px}
.btn.sm{padding:0 16px}
.chip,.chip.sm{padding:0 16px}
.g-choice .ic{background:transparent!important;border:2px solid currentColor;color:inherit!important}
.g-choice span{color:var(--muted)}
/* segmented controls: one outlined frame, the selected segment is filled */
.seg,.seg-toggle{background:transparent!important;border:2px solid var(--accent);border-radius:12px;padding:2px;box-shadow:none}
.seg-toggle{border-radius:999px;background:var(--surface)!important}
.seg button,.seg-toggle button{min-height:44px!important;border:0!important;background:transparent!important;color:var(--accent)!important;box-shadow:none!important}
.seg button.on,.seg-toggle button.on,.seg button:active,.seg-toggle button:active{background:var(--accent)!important;color:var(--on-accent)!important}
/* tab bar: floating Liquid Glass capsule; the current tab sits in a tinted glass lens */
:root{--glass-bg:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.46));--glass-rim:rgba(255,255,255,.85);--glass-edge:rgba(34,34,34,.10);--glass-hi:rgba(255,255,255,.95);--glass-shadow:0 12px 32px rgba(34,34,34,.16),0 2px 6px rgba(34,34,34,.08);--glass-lens:color-mix(in srgb,var(--accent) 14%,rgba(255,255,255,.55));--glass-lens-press:color-mix(in srgb,var(--accent) 24%,rgba(255,255,255,.5))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass-bg:linear-gradient(180deg,rgba(58,55,50,.62),rgba(30,29,27,.52));--glass-rim:rgba(255,255,255,.16);--glass-edge:rgba(0,0,0,.4);--glass-hi:rgba(255,255,255,.18);--glass-shadow:0 12px 32px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);--glass-lens:color-mix(in srgb,var(--accent) 22%,rgba(255,255,255,.08));--glass-lens-press:color-mix(in srgb,var(--accent) 34%,rgba(255,255,255,.08))}}
:root[data-theme="dark"]{--glass-bg:linear-gradient(180deg,rgba(58,55,50,.62),rgba(30,29,27,.52));--glass-rim:rgba(255,255,255,.16);--glass-edge:rgba(0,0,0,.4);--glass-hi:rgba(255,255,255,.18);--glass-shadow:0 12px 32px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);--glass-lens:color-mix(in srgb,var(--accent) 22%,rgba(255,255,255,.08));--glass-lens-press:color-mix(in srgb,var(--accent) 34%,rgba(255,255,255,.08))}
.tabbar{padding:6px;gap:2px;border-radius:999px;border:1px solid var(--glass-rim);background:var(--glass-bg);-webkit-backdrop-filter:blur(28px) saturate(1.9);backdrop-filter:blur(28px) saturate(1.9);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 var(--glass-edge),var(--glass-shadow);isolation:isolate}
/* soft specular sheen across the top half */
.tabbar::before{content:"";position:absolute;inset:1px;border-radius:inherit;background:linear-gradient(180deg,var(--glass-hi) 0%,transparent 48%);opacity:.35;pointer-events:none;z-index:-1}

/* ================= Design system v5: warm, calm, homey ================= */

/* bulk bar: pinned to the bottom in place of the tab bar */
.bulkbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;max-width:620px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
body.phone .bulkbar{bottom:22px}
.bb-n{flex:1 1 auto;font-size:1.0625rem}
.bb-btns{display:flex;gap:8px;flex-wrap:wrap}
.bb-btns .btn{flex:1 1 auto}
.bulk-pad{height:calc(var(--bottom-h,80px) + 48px)}
.btn[disabled]{opacity:1;--c:var(--muted);border-style:dashed;cursor:not-allowed}
.btn[disabled]:active{background:transparent!important;color:var(--muted)!important}
/* undo message */
#undo{position:fixed;left:12px;right:12px;bottom:calc(var(--bottom-h,80px) + 22px + env(safe-area-inset-bottom,0px));z-index:85;max-width:560px;margin:0 auto;pointer-events:none}
body.phone #undo{position:absolute;bottom:calc(var(--bottom-h,80px) + 30px)}
.utoast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--ink);border:2px solid var(--accent);border-radius:22px;box-shadow:var(--sh-2);padding:10px 10px 10px 16px;font-weight:700}
.utoast .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.utoast .btn{flex:none}
/* ===== Sort header fix: sticky in the page flow, below the status bar ===== */
/* iPhone frame: the 54px status-bar space is part of the page, so sticky top:54px lands just below it (no double offset). */
body.phone .scroller{padding-top:0}
body.phone #app{padding-top:54px}
.pin-prog-bar{position:sticky;top:calc(var(--safe-top) + var(--nav-h,62px));z-index:26;background:var(--bg);padding-top:2px}
.pin-prog-bar .pin-prog{padding-bottom:10px}
.pinbar{position:sticky;top:calc(var(--safe-top) + var(--nav-h,62px) + var(--prog-h,36px));z-index:25;background:var(--bg);margin-bottom:8px;padding:0 0 8px;border-bottom:1px solid var(--line);transition:transform .25s ease,opacity .2s ease}
/* scrolling down: toggle + chips slide up under the progress line; scrolling up brings them back */
body.bars-hidden .pinbar:not(:focus-within){transform:translateY(-100%);opacity:0;pointer-events:none}
.navbar{background:var(--bg)}
@media (max-height:560px){.pin-prog-bar,.pinbar{position:relative;top:auto}}

@media (prefers-contrast:more){

}

}

const SHEET_DETENTS = { s: .28, m: .52, l: .9 };

/* Pinned bars slide away while scrolling down and come back when scrolling up. */

/* Swipe a row right for Keep, left for Let go. */

    if (!on) { if (Math.abs(y) > 10 && Math.abs(y) > Math.abs(x)) { dead = true; return; } if (Math.abs(x) < 14) return; on = true; wrap.classList.add('swiping'); }

/* Drag the sheet's handle; it snaps to the nearest size. */
document.addEventListener('pointerdown', e => {
  const g = e.target.closest('.sheet .grab'); if (!g || !document.body.classList.contains('compact')) return;
  const sheet = g.closest('.sheet'), ws = g.closest('.workspace.ed'); if (!sheet || !ws) return;
  const box = Frame.on ? $('#screen').clientHeight : window.innerHeight;
  const scale = Frame.on ? (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dscale')) || 1) : 1;
  const sy = e.clientY, h0 = sheet.offsetHeight; let moved = false;

    moved = true; ws.classList.add('dragging');
    ws.style.setProperty('--sheet-h', clamp(h0 - dy, box * .2, box * .92) + 'px');
  };
  const up = () => {
    window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    ws.classList.remove('dragging');

function sortScreenKey() { return S.view === 'project' && currentTab() === 'sort' && isSortList() ? S.pid + '/' + S.role : ''; }

/* ---------- photo crops for item thumbnails ---------- */
const cropCache = new Map(); let photoImg = null, photoImgSrc = null;
function photoSrc() { const p = P(); if (p.photoKind === 'sample') return SAMPLE_URL; return S.photo || null; }
function loadPhoto(cb) {
  const src = photoSrc(); if (!src) return cb(null);
  if (photoImg && photoImgSrc === src && photoImg.complete) return cb(photoImg);
  const im = new Image(); im.onload = () => { photoImg = im; photoImgSrc = src; cb(im); }; im.onerror = () => cb(null); im.src = src;
}
function hydrateCrops() {
  const els = $$('img[data-crop]'); if (!els.length) return;
  loadPhoto(im => {
    for (const el of els) {
      const [x, y] = el.dataset.crop.split(',').map(Number);
      // Items without a photo pin have an empty crop; skip them instead of failing the whole render.
      if (!im || !el.dataset.crop || isNaN(x) || isNaN(y)) { el.removeAttribute('data-crop'); continue; }
      const key = photoImgSrc.length + ':' + photoImgSrc.slice(-40) + ':' + x.toFixed(3) + ',' + y.toFixed(3);
      if (!cropCache.has(key)) {
        const c = document.createElement('canvas'); c.width = c.height = 220;
        const g = c.getContext('2d'); const iw = im.naturalWidth || 1200, ih = im.naturalHeight || 800;
        const side = Math.min(iw, ih) * .34;
        const sx = clamp(x * iw - side / 2, 0, iw - side), sy = clamp(y * ih - side / 2, 0, ih - side);
        try { g.drawImage(im, sx, sy, side, side, 0, 0, 220, 220); cropCache.set(key, c.toDataURL('image/jpeg', .82)); } catch (e) { cropCache.set(key, ''); }

/* ---------- 3D callbacks ---------- */
function on3DTap(hit) {

    if (hit.type === 'piece') { if (S.role !== 'host') return; S.selPiece = hit.id; render(); }
    if (hit.type === 'zone') { S.zone = S.zone === hit.id ? null : hit.id; S.space.mode = S.zone ? 'zone' : 'any'; S.selPiece = null; if (S.zone && S.detent === 's') S.detent = 'm'; render(); }

  }

  render();

}

/* ---------- photo with pins ---------- */

  const scanning = ['requested', 'running'].includes(P().scan);

/* ---------- 2D plan (fallback + compare) ---------- */
function planSVG(L, compact, ghosts) {
  const p = P(); if (!p.W) return '';
  const pad = 20, W = p.W, Ln = p.L;
  const showRemoved = S.stage !== 'plan' && !L;
  const kept = S.items.filter(i => showRemoved || ghosts || !removed(i));
  const pcs = (L ? L.pieces : []).map(x => ({ ...CATMAP[x.fid], ...x })).filter(x => x.kind);
  const rect = (o, fill, stroke, label, dash) => { const f = fp(o); return `<g><rect x="${f.x}" y="${f.z}" width="${f.w}" height="${f.d}" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="2" ${dash ? 'stroke-dasharray="6 5"' : ''}/>${label && f.w > 40 && f.d > 22 ? `<text x="${f.x + f.w / 2}" y="${f.z + f.d / 2}" text-anchor="middle" dominant-baseline="middle" font-size="${Math.min(13, f.w / 7)}" fill="var(--ink)" font-family="var(--f-body)">${esc(label)}</text>` : ''}</g>`; };
  return `<svg class="plan-svg" viewBox="${-pad} ${-pad} ${W + pad * 2} ${Ln + pad * 2}" role="img" aria-label="Floor plan">
    <rect x="0" y="0" width="${W}" height="${Ln}" fill="var(--surface)" stroke="var(--ink)" stroke-width="4"/>
    ${kept.filter(i => NO_FLOOR.has(i.kind)).map(i => rect(i, 'rgba(143,163,181,.25)', 'transparent', '')).join('')}
    ${pcs.filter(i => NO_FLOOR.has(i.kind)).map(i => rect(i, 'rgba(240,176,60,.15)', 'var(--accent)', '', true)).join('')}
    ${kept.filter(i => !NO_FLOOR.has(i.kind)).map(i => rect(i, removed(i) ? 'transparent' : 'var(--surface-2)', removed(i) ? 'var(--letgo)' : 'var(--line-2)', compact ? '' : i.name, removed(i))).join('')}
    ${pcs.filter(i => !NO_FLOOR.has(i.kind)).map(i => rect(i, 'var(--accent-soft)', 'var(--accent)', compact ? '' : i.name)).join('')}
  </svg>`;
}

/* ============ Actions ============ */
async function runDetection(pid) {
  const p = S.P; if (!p || S.pid !== pid) return;
  if (p.scan === 'done') return;
  await Store.update('projects/' + pid, { scan: 'running' });
  let list;
  if (p.detectSet === 'custom' && p.customList) {
    list = p.customList.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [name, k] = l.split(',').map(s => s.trim()); const kind = KINDS[k] ? k : guessKind(name); return { name, kind }; });
  } else list = SAMPLE_ITEMS;
  const sx = p.W / SAMPLE_ROOM.W, sz = p.L / SAMPLE_ROOM.L;
  const placed = S.items.map(i => ({ ...i }));
  let order = S.items.length;
  for (let i = 0; i < list.length; i++) {
    const s = list[i], k = KINDS[s.kind] || KINDS.generic;

  gSkip(d) { S.gSkip = S.gSkip.filter(x => x !== d.id).concat(d.id); const q = guestQueue(); if (q.length > 1) render(); else toast('That’s the last one left', 'info'); },
  gNote(d) { const it = S.items.find(i => i.id === d.id); S.modal = { type: 'gNote', id: d.id, text: it?.note || '' }; render(); },
  saveGNote() { Store.update(`projects/${S.pid}/items/${S.modal.id}`, { note: (S.modal.text || '').trim() }); S.modal = null; render(); toast('Note saved', 'info', 'message'); },

  /* ----- facilitator console ----- */
  wzPick(d) { S.wz.pid = d.id; openProject(d.id, null, { wizard: true }); },
  wzOpen(d) { openProject(S.wz.pid, d.v); },
  wzSend() { if (S.P && S.P.scan !== 'done') { S.P.scan = 'requested'; runDetection(S.wz.pid); } else toast('Objects were already sent. Clear them first to send again.', 'info'); },
  wzAuto(d, el) { Store.update('projects/' + S.wz.pid, { wozAuto: el.checked }); },
  wzSet(d) { Store.update('projects/' + S.wz.pid, { detectSet: d.v }); },
  async wzClearItems() { for (const it of S.items) await Store.del(`projects/${S.wz.pid}/items/${it.id}`); Store.update('projects/' + S.wz.pid, { scan: 'none' }); },
  wzDecide(d) { const it = S.items.find(i => i.id === d.id); const nd = it.decision === d.v ? null : d.v; Store.update(`projects/${S.wz.pid}/items/${d.id}`, { decision: nd, decidedBy: nd ? 'guest' : null, decidedAt: Date.now(), suggestion: null }); },
  wzJoin() { Store.update('projects/' + S.wz.pid, { guestJoinedAt: Date.now() }); },
  wzGuestName() { const v = ($('#wz-gname') || {}).value; if (v) Store.update('projects/' + S.wz.pid, { guestName: v.trim() }); },
  wzStage(d) { Store.update('projects/' + S.wz.pid, { stage: d.v }); },
  async wzReset() { for (const it of S.items) await Store.update(`projects/${S.wz.pid}/items/${it.id}`, { decision: null, decidedBy: null, suggestion: null }); toast('Decisions cleared', 'info'); },
  async wzResetOwners() { for (const it of S.items) await Store.update(`projects/${S.wz.pid}/items/${it.id}`, { owner: null, decision: null, decidedBy: null, suggestion: null }); toast('Owners and decisions cleared', 'info'); },
  async wzClearPlans() { for (const l of S.layouts) await Store.del(`projects/${S.wz.pid}/layouts/${l.id}`); toast('Plans removed', 'info'); },
  async wzDel() {
    if (!confirm('Delete this room for everyone?')) return;
    const pid = S.wz.pid;
    for (const it of S.items) await Store.del(`projects/${pid}/items/${it.id}`);
    for (const l of S.layouts) await Store.del(`projects/${pid}/layouts/${l.id}`);
    await Store.del(`projects/${pid}/media/photo`); await Store.del('projects/' + pid);
    S.wz.pid = null; unsubAll(); S.P = null; render();
  },
  async wzDemo(d) {
    const host = (($('#wz-h') || {}).value || 'Maya').trim(), guest = (($('#wz-g') || {}).value || 'Sam').trim();
    const pid = roomCode(), plan = d.v === 'plan';
    await Store.set('projects/' + pid, { name: 'Upstairs office', from: 'Home office', to: 'Guest room', ...SAMPLE_ROOM, hostName: host, hostDevice: 'demo-' + uid(4), guestName: guest, stage: plan ? 'plan' : 'sort', scan: 'done', wozAuto: true, detectSet: 'sample', customList: '', photoKind: 'sample', createdAt: Date.now(), invitedAt: Date.now(), guestJoinedAt: plan ? Date.now() : 0 });
    const decide = { 'Desk': 'letgo', 'Office chair': 'send', 'Filing cabinet': 'letgo', 'Monstera plant': 'keep', 'Bookshelf': 'keep', 'Floor lamp': 'keep', 'Armchair': 'keep', 'Blue rug': 'keep', 'Exercise bike': 'send', 'Moving boxes': 'send', 'Guitar': 'send' };
    let n = 0;
    for (const s of SAMPLE_ITEMS) {
      const it = { name: s.name, kind: s.kind, w: s.w, d: s.d, h: s.h, color: s.color, rot: s.rot, x: s.x, z: s.z, pin: { x: s.pin[0], y: s.pin[1] }, owner: s.own, decision: null, decidedBy: null, suggestion: null, note: '', source: 'detected', order: n++ };
      if (plan) { it.decision = decide[s.name]; it.decidedBy = s.own === 'guest' ? 'guest' : 'host'; }
      await Store.set(`projects/${pid}/items/i${uid(7)}`, it);
    }
    if (plan) await Store.set(`projects/${pid}/layouts/A`, { name: 'Option A', order: 0, pieces: [], likes: {} });
    S.wz.pid = pid; openProject(pid, null, { wizard: true });
    toast(`Demo room ${pid} created`, 'info');
  },
  wzWoz(d, el) { S.showWoz = el.checked; LS.set('showWoz', S.showWoz); render(); },
  wzForget() { localStorage.removeItem('ss.mine'); S.myProjects = []; toast('This device no longer lists any rooms', 'info'); render(); }
};

/* ----- events ----- */
document.addEventListener('click', e => {
  if (S.swiped) { e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const stop = e.target.closest('[data-stop]');
  if (stop && el.contains(stop) && stop !== el) return;
  const ctl = e.target.closest('input,textarea,select,label');
  if (ctl && ctl !== el && el.contains(ctl)) return;
  if (el.classList.contains('pin') && S.pinDragged) { S.pinDragged = false; return; }
  const fn = ACT[el.dataset.act];
  if (fn) { if (!(el.tagName === 'INPUT')) e.preventDefault(); fn({ ...el.dataset }, el, e); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.file === 'photo' && t.files && t.files[0]) {
    S.create.processing = true; render();
    try { S.create.photoData = await downscale(t.files[0]); S.create.photoKind = 'upload'; } catch (err) { toast('That file couldn’t be opened as a photo. Try a JPG or PNG.', 'info'); }
    S.create.processing = false; render(); return;
  }
  if (t.dataset.itemname) { const v = t.value.trim(); if (v) Store.update(`projects/${S.pid}/items/${t.dataset.itemname}`, { name: v }); return; }
  if (t.dataset.itemnote) { Store.update(`projects/${S.pid}/items/${t.dataset.itemnote}`, { note: t.value.trim() }); return; }
  if (t.dataset.space) { S.space[t.dataset.space] = clamp(parseInt(t.value) || 0, 10, 800); setTimeout(render, 0); return; }
  if (t.dataset.bind && t.dataset.bind.startsWith('create.') && ['W', 'L', 'H'].includes(t.dataset.bind.slice(7))) {
    const k = t.dataset.bind.slice(7); S.create[k] = clamp(parseInt(t.value) || S.create[k], +t.dataset.min, +t.dataset.max); setTimeout(render, 0);
  }
  if (t.dataset.wz === 'custom') Store.update('projects/' + S.wz.pid, { customList: t.value });
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.bind) {
    let v = t.value;
    if (t.dataset.bind === 'join.code') { v = v.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (t.value !== v) t.value = v; S.join.err = ''; }
    setPath(t.dataset.bind, v);
    if (t.dataset.bind.startsWith('create.') && ['W', 'L'].includes(t.dataset.bind.slice(7))) { const fpv = $('.floorprev'); const n = parseInt(v); if (fpv && n >= 150) { const W = t.dataset.bind.endsWith('W') ? n : S.create.W, L = t.dataset.bind.endsWith('L') ? n : S.create.L; fpv.innerHTML = floorPreview(W, L); } }
    if (t.dataset.bind === 'modal.name' && S.modal && S.modal.type === 'addGuest') { const b = $('[data-act="saveGuest"]'); if (b) b.textContent = 'Add ' + (v.trim() || 'person'); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.modal) { S.modal = null; render(); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.bind === 'join.code') { e.preventDefault(); ACT.joinFind(); }
  if (S.view === 'project' && S.stage === 'plan' && S.selPiece && !isTyping()) {
    if (e.key === 'r' || e.key === 'R') ACT.rotPiece();
    if (e.key === 'Delete' || e.key === 'Backspace') ACT.delPiece();
  }
});
/* drag pins on the photo to correct positions */
document.addEventListener('pointerdown', e => {
  const pin = e.target.closest('.pin[data-drag]'); if (!pin) return;
  const ph = pin.closest('[data-photo]'); if (!ph) return;
  const r = ph.getBoundingClientRect(), id = pin.dataset.id, sx = e.clientX, sy = e.clientY;
  let moved = false, fx = 0, fy = 0;
  const mv = ev => {
    if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return;
    moved = true; pin.classList.add('drag');
    fx = clamp((ev.clientX - r.left) / r.width, .02, .98); fy = clamp((ev.clientY - r.top) / r.height, .02, .98);
    pin.style.left = fx * 100 + '%'; pin.style.top = fy * 100 + '%';
  };
  const up = () => {
    window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up);
    if (moved) { S.pinDragged = true; setTimeout(() => { S.pinDragged = false; }, 300); Store.update(`projects/${S.pid}/items/${id}`, { pin: { x: +fx.toFixed(4), y: +fy.toFixed(4) } }); }
  };
  window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
});

/* ============ Facilitator console ============ */
function viewWizard() {
  const all = [...S.projects].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const p = S.wz.pid ? S.P : null;
  const left = `<div class="card"><h3 style="font-size:1.25rem">Rooms</h3>
    <div style="display:grid;gap:8px;max-height:360px;overflow:auto">${all.map(x => `<button class="wz-proj ${S.wz.pid === x.id ? 'on' : ''}" data-act="wzPick" data-id="${x.id}"><b style="letter-spacing:.06em">${esc(x.id)}</b> ${esc(x.name)}<div class="hint">${esc(x.hostName)}${x.guestName ? ' and ' + esc(x.guestName) : ''}, ${esc(x.stage)}${x.scan === 'requested' ? ', <b style="color:var(--letgo)">scan waiting</b>' : ''}</div></button>`).join('') || '<p class="muted small">No rooms yet.</p>'}</div>
    <div style="border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px"><div class="lbl">Create a demo room</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input class="input" id="wz-h" placeholder="Host (Maya)"><input class="input" id="wz-g" placeholder="Guest (Sam)"></div>
      <button class="btn secondary sm" data-act="wzDemo" data-v="sort">Ready to sort</button><button class="btn secondary sm" data-act="wzDemo" data-v="plan">Ready to plan</button></div>
  </div>
  <div class="card"><div class="lbl">This device</div>
    <label class="switch"><input type="checkbox" data-act="wzWoz" ${S.showWoz ? 'checked' : ''}> Show “Simulated” labels in the app</label>
    <p class="hint">Data: ${Store.mode === 'cloud' ? '<b style="color:var(--keep)">shared online</b>. Other devices see changes live.' : '<b style="color:var(--letgo)">this browser only</b>. Open the published link while signed in to share between devices.'}</p>
    <button class="btn ghost sm" data-act="wzForget">Clear room list on this device</button></div>`;
  let right;
  if (!p) right = `<div class="card"><p class="muted">Pick a room to control it.</p></div>`;
  else {
    const gItems = S.items.filter(i => i.owner === 'guest' || i.owner === 'both');
    const scanAgo = p.scanAt ? Math.round((Date.now() - p.scanAt) / 1000) : 0;
    right = `<div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="font-size:1.625rem;flex:1">${esc(p.name)} <span class="code" style="font-size:1.25rem">${esc(S.wz.pid)}</span></h2>
      <button class="btn sm" data-act="wzOpen" data-v="host">Open as ${esc(p.hostName)}</button>${p.guestName ? `<button class="btn secondary sm" data-act="wzOpen" data-v="guest">Open as ${esc(p.guestName)}</button>` : ''}</div>
      <div class="wz-row"><b style="width:100%">Object detection <span class="woz">Simulated</span></b>
        <span class="tag ${p.scan === 'requested' ? 'letgo' : p.scan === 'done' ? 'keep' : ''}">${p.scan === 'requested' ? `Participant pressed scan ${scanAgo}s ago` : p.scan === 'done' ? `${S.items.length} objects in room` : p.scan === 'running' ? 'Sending' : 'Not scanned yet'}</span>
        <label class="switch"><input type="checkbox" data-act="wzAuto" ${p.wozAuto !== false ? 'checked' : ''}> Send automatically after 4 s</label></div>
      <div class="wz-row"><span class="hint">Objects to “detect”:</span><button class="chip sm ${p.detectSet !== 'custom' ? 'on' : ''}" data-act="wzSet" data-v="sample">Example home office</button><button class="chip sm ${p.detectSet === 'custom' ? 'on' : ''}" data-act="wzSet" data-v="custom">My own list</button>
        ${p.detectSet === 'custom' ? `<textarea class="input" data-wz="custom" rows="5" placeholder="One per line, e.g.&#10;Sewing table, table&#10;Treadmill&#10;Wardrobe">${esc(p.customList || '')}</textarea><p class="hint" style="width:100%">Write what you see in the participant’s photo. They can drag the numbers onto the right objects.</p>` : ''}
        <div style="display:flex;gap:8px;width:100%"><button class="btn sm" data-act="wzSend">Send detected objects now</button><button class="btn danger sm" data-act="wzClearItems">Clear all objects</button></div></div>
      <div class="wz-row"><b style="width:100%">Second person</b><input class="input" id="wz-gname" value="${esc(p.guestName || '')}" placeholder="Name" style="max-width:200px"><button class="btn secondary sm" data-act="wzGuestName">Save name</button><button class="btn secondary sm" data-act="wzJoin">Mark as joined</button>
        <span class="hint">${p.guestJoinedAt ? 'Joined' : p.invitedAt ? 'Invited' : 'Not invited'}</span></div>
      ${gItems.length ? `<div class="wz-row" style="display:grid;gap:6px"><b>Decide as ${esc(p.guestName || 'guest')}</b>${gItems.map(it => `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="flex:1;min-width:120px">${esc(it.name)}</span>${['keep', 'send', 'letgo'].map(d => `<button class="dbtn ${d} ${it.decision === d ? 'on' : ''}" style="min-height:36px;padding:0 10px" data-act="wzDecide" data-id="${it.id}" data-v="${d}">${DEC[d].label}</button>`).join('')}</div>`).join('')}</div>` : ''}
      <div class="wz-row"><b style="width:100%">Stage seen by the second person</b>${['capture', 'sort', 'plan'].map(s => `<button class="chip sm ${p.stage === s ? 'on' : ''}" data-act="wzStage" data-v="${s}">${s}</button>`).join('')}</div>
      <div class="wz-row"><b style="width:100%">Reset</b><button class="btn secondary sm" data-act="wzReset">Clear decisions</button><button class="btn secondary sm" data-act="wzResetOwners">Clear owners and decisions</button><button class="btn secondary sm" data-act="wzClearPlans">Remove plans</button><button class="btn danger sm" data-act="wzDel">Delete room</button></div>
    </div>`;
  }
  return `${topbar(`<button class="btn soft sm" data-act="home">Back to the app</button>`)}<main class="wz">
    <h1 style="font-size:2.125rem;margin-bottom:10px">Facilitator console</h1>
    <div class="banner" style="margin-bottom:16px">Participants never see this page. Object detection, phone measuring, sending texts and store links are simulated. Rooms, photos, owners, decisions, live sync between devices, the 3D room, size filters and furniture placement are real.</div>
    <div class="wz-grid"><div style="display:grid;gap:16px;align-content:start">${left}</div><div>${right}</div></div></main>`;
}

/* ============ Boot ============ */
const _open = openProject;
openProject = function (pid, role, opts = {}) {
  if (!opts.wizard) return _open(pid, role);
  unsubAll();
  S.pid = pid; S.P = null; S.items = []; S.layouts = []; S.photo = null; S.loaded = { p: false, i: false, l: false };
  subs.push(Store.watchDoc('projects/' + pid, d => { S.P = d; S.loaded.p = true; render(); }));
  subs.push(Store.watchCol(`projects/${pid}/items`, l => { l.sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); S.items = l; render(); }));
  subs.push(Store.watchCol(`projects/${pid}/layouts`, l => { S.layouts = l; render(); }));
  render();
};
function route() {
  const h = (location.hash || '').slice(1);
  S.modal = null;
  if (h === 'wizard') { if (S.view !== 'wizard') ACT.wizard(); return; }
  if (h === 'home' && S.view === 'home') return;
  if (h.startsWith('room-')) { const pid = h.slice(5); if (S.myProjects.includes(pid)) { openProject(pid); return; } }
  S.view = 'home'; render();
}
async function boot() {
  await Store.init();
  Store.watchCol('projects', list => {
    S.projects = list;
    if (['home', 'wizard', 'join'].includes(S.view)) render();
  });
  Presence.init(() => { if (S.view === 'project') render(); });
  route();
  window.addEventListener('hashchange', route);
  setInterval(() => { if (S.view === 'wizard' && S.P && S.P.scan === 'requested' && !isTyping()) render(); }, 2000);
}
boot();
</script></body></html>
