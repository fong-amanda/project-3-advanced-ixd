# XcodeGen spec for Shared Space.
# Regenerate the Xcode project after adding/removing files outside Xcode:
#   cd ios && xcodegen generate
#
# ── TestFlight placeholders: change these before archiving ──────────────────
#   PRODUCT_BUNDLE_IDENTIFIER  must be unique to you, e.g. edu.northeastern.yourname.sharedspace
#   DEVELOPMENT_TEAM           your 10-character Team ID (developer.apple.com → Membership)
#   MARKETING_VERSION          user-facing version, e.g. 1.0
#   CURRENT_PROJECT_VERSION    build number; bump it for every upload to App Store Connect
#   INFOPLIST_KEY_CFBundleDisplayName   name under the icon
# ─────────────────────────────────────────────────────────────────────────────
name: SharedSpace

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.24.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SharedSpace:
    type: application
    platform: iOS
    sources:
      - path: SharedSpace
        excludes:
          - Info.plist
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amandafong.sharedspace   # ← change me
        DEVELOPMENT_TEAM: ""                                  # ← your Team ID
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"                           # iPhone only
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SharedSpace/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO   # Theme names the colours by role
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shared Space       # ← name under the icon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Shared Space uses the camera to scan your room in 3D, show your new design in the real room, and take photos of items."
    info:
      path: SharedSpace/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: sharedspace
            CFBundleURLSchemes: [sharedspace]
        UIRequiredDeviceCapabilities: [arm64]
        ITSAppUsesNonExemptEncryption: false   # skips the export-compliance question in TestFlight
